spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chronos
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

    spring:
     jpa:
       hibernate:
         ddl-auto: update

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/chronos}

server:
  port: 8082
  servlet:
    context-path: /

logging:
  level:
    com.chronos: INFO
    org.hibernate.SQL: WARN
    org.springframework.security: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
